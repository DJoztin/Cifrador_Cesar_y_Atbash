<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoClásico — Cifrado César & Atbash</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
 
  </head>
  <body>
    <header>
      <div class="eyebrow">Sistema de Criptografía Clásica</div>
      <h1>CryptoClásico</h1>
      <p>Cifrado César &amp; Atbash · Basado en ASCII</p>
    </header>

    <div class="container">
      <!-- Selección de módulo -->
      <div class="module-select">
        <button class="module-btn cesar active" onclick="selectModule('cesar')">
          <div class="tag">Módulo I</div>
          <h3>Cifrado César</h3>
          <p>
            Desplaza cada carácter N posiciones en el conjunto de caracteres
            definido.
          </p>
        </button>
        <button class="module-btn atbash" onclick="selectModule('atbash')">
          <div class="tag">Módulo II</div>
          <h3>Cifrado Atbash</h3>
          <p>
            Invierte el conjunto de caracteres: el primero ↔ último, segundo ↔
            penúltimo…
          </p>
        </button>
      </div>

      <!-- Panel principal -->
      <div class="panel">
        <div class="panel-header">
          <div class="status-dot"></div>
          <span class="panel-title" id="panelTitle">Módulo César</span>
          <span class="badge" id="moduleBadge">CÉSAR</span>
        </div>

        <!-- Conjunto de caracteres -->
        <div class="charset-section">
          <label>Conjunto de Caracteres (Charset)</label>
          <input
            type="text"
            id="charset"
            value="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,;:!?-_@#"
          />
          <div class="charset-hint">
            Puedes modificar los caracteres usados para el cifrado. El orden
            importa.
          </div>
        </div>

        <!-- Desplazamiento (solo César) -->
        <div id="shiftSection" class="shift-section">
          <div>
            <label>Desplazamiento (Clave César)</label>
            <input
              type="range"
              id="shiftRange"
              min="1"
              max="25"
              value="3"
              oninput="updateShift()"
            />
          </div>
          <div class="shift-display" id="shiftVal">3</div>
        </div>

        <!-- Texto de entrada -->
        <div>
          <label>Texto de Entrada</label>
          <textarea
            id="inputText"
            placeholder="Escribe aquí el mensaje a cifrar o descifrar..."
          ></textarea>
        </div>

        <div class="sep"></div>

        <!-- Botones -->
        <div class="action-row">
          <button class="btn btn-cipher" onclick="process('cipher')">
            ⬆ Cifrar
          </button>
          <button class="btn btn-decipher" onclick="process('decipher')">
            ⬇ Descifrar
          </button>
          <button class="btn btn-clear" onclick="clearAll()">
            ✕ Limpiar todo
          </button>
        </div>

        <!-- Resultado -->
        <div class="result-section" id="resultSection">
          <div class="result-label">
            <span id="resultLabel">Resultado</span>
            <button class="copy-btn" onclick="copyResult()">Copiar</button>
          </div>
          <div class="result-text" id="resultText">
            El resultado aparecerá aquí...
          </div>
        </div>
      </div>

      <!-- Visualización del mapeo -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Tabla de Sustitución</span>
        </div>
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 12px">
          <span style="color: var(--accent)">■</span> Original &nbsp;→&nbsp;
          <span style="color: var(--accent2)">■</span> Cifrado
        </div>
        <div class="alpha-visual">
          <div class="alpha-table" id="alphaTable"></div>
        </div>
      </div>

    </div>
    
    <script>
      
  // ─── ESTADO ───
  let currentModule = 'cesar';

  // ─── MÓDULO ───
  function selectModule(mod) {
    currentModule = mod;
    document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.module-btn.${mod}`).classList.add('active');

    const isCesar = mod === 'cesar';
    document.getElementById('shiftSection').style.display = isCesar ? 'grid' : 'none';
    document.getElementById('panelTitle').textContent = isCesar ? 'Módulo César' : 'Módulo Atbash';
    
    const badge = document.getElementById('moduleBadge');
    badge.textContent = isCesar ? 'CÉSAR' : 'ATBASH';
    badge.className = isCesar ? 'badge' : 'badge atbash-badge';

    renderAlphaTable();
  }

  // ─── DESPLAZAMIENTO ───
  function updateShift() {
    const val = document.getElementById('shiftRange').value;
    document.getElementById('shiftVal').textContent = val;
    renderAlphaTable();
  }

  // ─── LÓGICA CENTRAL ───
  function getCharset() {
    return document.getElementById('charset').value;
  }

  function cesarCipher(text, charset, shift, decrypt) {
    const n = charset.length;
    const d = decrypt ? -shift : shift;
    return text.split('').map(ch => {
      const idx = charset.indexOf(ch);
      if (idx === -1) return ch; // carácter no en charset → pasa sin cambio
      return charset[((idx + d) % n + n) % n];
    }).join('');
  }

  function atbashCipher(text, charset) {
    const n = charset.length;
    return text.split('').map(ch => {
      const idx = charset.indexOf(ch);
      if (idx === -1) return ch;
      return charset[n - 1 - idx];
    }).join('');
  }

  // ─── PROCESO ───
  function process(mode) {
    const text = document.getElementById('inputText').value;
    const charset = getCharset();
    const shift = parseInt(document.getElementById('shiftRange').value);

    if (!text.trim()) {
      showResult('⚠ Ingresa un texto primero.', mode);
      return;
    }

    let result;
    if (currentModule === 'cesar') {
      result = cesarCipher(text, charset, shift, mode === 'decipher');
    } else {
      // Atbash es su propio inverso
      result = atbashCipher(text, charset);
    }

    showResult(result, mode);
    renderAlphaTable();
  }

  function showResult(text, mode) {
    const label = mode === 'cipher' ? '🔒 Texto Cifrado' : '🔓 Texto Descifrado';
    document.getElementById('resultLabel').textContent = label;
    const el = document.getElementById('resultText');
    el.textContent = text;
    el.classList.remove('flash');
    void el.offsetWidth; // reflow
    el.classList.add('flash');
  }

  // ─── COPIAR ───
  function copyResult() {
    const text = document.getElementById('resultText').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ Copiado';
      setTimeout(() => btn.textContent = 'Copiar', 1500);
    });
  }

  // ─── LIMPIAR ───
  function clearAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('resultText').textContent = 'El resultado aparecerá aquí...';
    document.getElementById('resultLabel').textContent = 'Resultado';
  }

  // ─── TABLA DE SUSTITUCIÓN ───
  function renderAlphaTable() {
    const charset = getCharset();
    const shift = parseInt(document.getElementById('shiftRange').value);
    const table = document.getElementById('alphaTable');
    table.innerHTML = '';

    // Mostrar solo los primeros 40 para no saturar la UI
    const display = charset.slice(0, 40);

    display.split('').forEach(ch => {
      let enc;
      if (currentModule === 'cesar') {
        enc = cesarCipher(ch, charset, shift, false);
      } else {
        enc = atbashCipher(ch, charset);
      }

      const pair = document.createElement('div');
      pair.className = 'alpha-pair';
      pair.innerHTML = `
        <div class="alpha-char alpha-orig" title="ASCII: ${ch.charCodeAt(0)}">${ch === ' ' ? '·' : escapeHtml(ch)}</div>
        <div class="alpha-arrow">↓</div>
        <div class="alpha-char alpha-enc" title="ASCII: ${enc.charCodeAt(0)}">${enc === ' ' ? '·' : escapeHtml(enc)}</div>
      `;
      table.appendChild(pair);
    });

    if (charset.length > 40) {
      const more = document.createElement('div');
      more.style.cssText = 'display:flex;align-items:center;color:var(--muted);font-size:11px;padding:0 8px;';
      more.textContent = `+${charset.length - 40} más`;
      table.appendChild(more);
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── INIT ───
  renderAlphaTable();

  // Actualizar tabla al cambiar charset
  document.getElementById('charset').addEventListener('input', renderAlphaTable);

    </script>
  </body>

     
</html>
